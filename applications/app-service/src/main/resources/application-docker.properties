# Conexión R2DBC a la base de datos MySQL del contenedor mysql-solicitudes
spring.r2dbc.url=r2dbc:mysql://mysql-solicitudes:3306/solicitudes
spring.r2dbc.username=admin
spring.r2dbc.password=5697964c

# Puerto interno del contenedor
server.port=8081

# URL del servicio de autenticación dentro de la red Docker
app.services.autenticacion.url=http://autenticacion:8080

# Pool de conexiones R2DBC
spring.r2dbc.pool.initial-size=5
spring.r2dbc.pool.max-size=10

# Inicialización de scripts SQL (si usás spring.sql.init)
spring.sql.init.mode=always

# Logging detallado para trazabilidad
logging.level.com.tuempresa.solicitudes=DEBUG
logging.level.io.r2dbc=DEBUG

# Sobrescribir configuración personalizada para Docker
adapters.r2dbc.mysql.host=mysql-solicitudes
adapters.r2dbc.mysql.port=3306
adapters.r2dbc.mysql.database=solicitudes
adapters.r2dbc.mysql.username=admin
adapters.r2dbc.mysql.password=5697964c

microservices.autenticacion.url=http://autenticacion:8080